packages:
  - "apps/*"
  - "packages/*"
  # Not apps/* or packages/*: the eval harness (spec §5 Phase 5 gate)
  # lives at the repo root per docs/SPEC.md's own layout (`eval/golden.jsonl`,
  # not `packages/eval/src/golden.jsonl`), but still needs @periplo/bazaar
  # and @periplo/search as real workspace dependencies to seed and query
  # the catalog, so it needs an explicit entry here.
  - "eval"
allowBuilds:
  # esbuild's install script only fetches its own platform-specific binary
  # (no arbitrary code beyond that) and is required for tsx/vitest to work.
  esbuild: true
  # Same reasoning as esbuild: its install script fetches its own
  # platform-specific prebuilt binary (the ONNX Runtime native addon) and
  # is required for fastembed's local embedding pipeline (packages/search,
  # Phase 5) to run at all.
  onnxruntime-node: true
minimumReleaseAgeExclude:
  - tsx@4.23.9
# `next` (apps/site) lists `sharp` as an optional dependency, and sharp's
# prebuilt `@img/sharp-libvips-*` binaries are LGPL-3.0-or-later, which
# licence-check denies in the production graph. apps/site never uses
# next/image optimization (`images.unoptimized: true` in its next.config.ts),
# so sharp is excluded outright rather than installed and waived.
ignoredOptionalDependencies:
  - sharp
# Vulnerable transitive versions this round's deps otherwise resolve to
# (pnpm audit --prod, 2026-10-24); @stellar/stellar-sdk 16.3.0 pins axios
# at exactly 1.18.0 and ajv resolves fast-uri within its own ^3.0.1 range
# to 3.1.5, both predating their advisories' patched versions.
overrides:
  axios: ">=1.20.0"
  follow-redirects: ">=1.16.1"
  fast-uri: "3.1.9"
  smol-toml: ">=1.8.1"
  source-map-js: ">=1.2.2"
# GHSA-mrhx-c7xc-m3w5 (zod, "exhaust memory while validating oversized
# constrained collections") is ignored deliberately, not silently: its
# advisory range is an unbounded "<4.6.6" with no floor, but the described
# mechanism is in zod v4's own internals; every path `pnpm audit` reports
# (23, through @x402/core, viem, abitype, @signinwithethereum/siwe)
# resolves zod ^3.24.2, built and tested against v3's API. Forcing a v4
# override across packages that have never run against v4 risks breaking
# real payment/signing logic, a worse outcome than the advisory as scoped
# to this repo. Revisit if @x402/core (or viem) ever bumps its own zod
# range. Added by `pnpm audit --ignore GHSA-mrhx-c7xc-m3w5`, which writes
# here automatically; kept as the one entry under version control rather
# than a CLI flag only CI would carry.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
