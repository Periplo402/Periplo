name: UptoSettlement build attestation (SEP-55)

# Never on push or pull_request: this must not run on every commit to main
# or touch ci.yml's own gate. Fires only when a GitHub Release is
# published, or manually via workflow_dispatch. Delegates the actual
# build/attestation to the real, published stellar-expert/soroban-build-workflow
# (docs/DEFERRED.md, SEP-55/SEP-58 build verification writeup), pinned by
# commit SHA, not @main.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name for this run (workflow_dispatch only; a release-triggered run uses the release's own tag)"
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  attest-upto-settlement:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@6b16426dd3a61715ddddf83a2df322a6371fe071
    with:
      release_name: ${{ github.event.release.tag_name || inputs.release_name }}
      release_description: "UptoSettlement contract build, SEP-55 attestation (github.com/Eras256/Periplo)"
      # Plain string, not the bracketed `'["path"]'` form the reusable
      # workflow's own README shows: read the real release.yml at the pinned
      # SHA above, `relative_path` is concatenated directly into a shell
      # path (`$WORK_DIR/${{ inputs.relative_path }}`), never parsed as
      # JSON/an array by this version of the workflow.
      relative_path: "contracts/upto-settlement"
      package: "upto-settlement"
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
