[package]
name = "agent-smart-account"
version = "0.1.0"
edition = "2021"
publish = false
description = "Phase 6b demo: a real OpenZeppelin stellar-accounts smart account scoped to authorizing only UptoSettlement calls, for an agent key with a reserved budget."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# Pinned to match the published crate's own soroban-sdk requirement exactly
# (see contracts/upto-settlement/src/budget.rs's module doc for why that
# crate isn't a dependency of upto-settlement itself). stellar-accounts
# 0.8.0 (released 2026-10-20, the Phase 6b watch-item trigger in
# docs/DEFERRED.md) moved its own soroban-sdk requirement to ^28.0, up
# from 0.7.2's ^26.1; bumped here to match, re-attempting the two-context
# settle() blocker now that the release is real and stable. This crate
# has no soroban-sdk-version-sensitive dependency of its own, so it can
# target the SDK version the account framework actually requires without
# affecting anything else in the repo.
soroban-sdk = "28.0.0"
stellar-accounts = "0.8.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
