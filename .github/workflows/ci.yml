name: CI

on:
  push:
    branches: [main]
  pull_request:

# History: on 2026-08-31 two pushes 83 seconds apart triggered two
# overlapping runs against the same production Supabase project, and one
# run's `pnpm eval` cleanup deleted fixtures the other was still reading
# (nDCG@10 fell from 0.93 to 0.21). `pnpm eval` and the integration suites
# now run against a throwaway local Supabase stack started inside the job
# (see "Start an ephemeral Supabase" below), so CI no longer writes to the
# production project at all and two runs cannot race each other. This
# group still cancels a run superseded by a newer push, to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Phase 0 gate (master spec): pnpm install && pnpm typecheck && pnpm lint && pnpm test
# must exit 0. licence-check and osv-scan are additional CI-only gates from §6/§7.
jobs:
  build:
    runs-on: ubuntu-latest
    # No SUPABASE_* here on purpose: the database steps get URL and keys
    # from the ephemeral stack started below. Production Supabase secrets
    # are only used by the manual `prod-parity` workflow.
    env:
      STELLAR_FEE_SPONSOR_SECRET: ${{ secrets.STELLAR_FEE_SPONSOR_SECRET }}
      STELLAR_FEE_SPONSOR_PUBLIC: ${{ secrets.STELLAR_FEE_SPONSOR_PUBLIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache fastembed model (BGESmallENV15, spec §5 Phase 5)
        # Runners are fresh VMs with no persistent disk between runs, and
        # `packages/search/src/embed.ts` pins the cache dir to os.tmpdir()
        # specifically to keep it out of the repo (see docs/DEFERRED.md),
        # which also means it starts empty on every CI run unless restored
        # here. Without this, the Test and Search-relevance steps below
        # both depend on huggingface.co being reachable and fast on every
        # single push, and the eval gate can't be skipped when it isn't.
        # Keyed on the exact fastembed version pinned in
        # packages/search/package.json plus the model name, since a
        # fastembed bump could change the download URL or file layout.
        uses: actions/cache@v4
        with:
          path: /tmp/periplo-fastembed-cache
          key: fastembed-model-v1-fastembed2.1.0-BGESmallENV15

      - name: Install dependencies
        # ONNXRUNTIME_NODE_INSTALL_CUDA=skip: onnxruntime-node's postinstall
        # (packages/search's local embedding pipeline, Phase 5) defaults to
        # downloading a ~340MB CUDA provider binary on Linux/x64 installs,
        # this runner and the Fly deployment are both CPU-only, so it's
        # pure waste. Found by actually inspecting the installed size, not
        # assumed; see docs/DEFERRED.md.
        run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Set up the Supabase CLI
        # Pinned by commit SHA (third-party action) and to the CLI version
        # used locally, so a moving tag cannot change what CI runs.
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.115.0

      - name: Start an ephemeral Supabase (Postgres 17 + pgvector + PostgREST)
        # Builds a throwaway database from supabase/migrations/ on this
        # runner, so the RLS/integration suites and `pnpm eval` never touch
        # the production project. Only the database and the Data API are
        # needed; every other service is excluded to save image pulls.
        # `gotrue` (auth) is kept on purpose: `supabase status` only prints
        # ANON_KEY and SERVICE_ROLE_KEY while it is running (found in the
        # first PR run, where excluding it left only the URLs).
        timeout-minutes: 10
        run: >-
          supabase start -x
          realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,studio,postgres-meta

      - name: Point SUPABASE_* at the ephemeral stack
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase-status.json"
          echo "status keys (names only):"
          jq -r 'keys[]' "$RUNNER_TEMP/supabase-status.json"
          url=$(jq -r '.API_URL // .SUPABASE_URL // empty' "$RUNNER_TEMP/supabase-status.json")
          anon=$(jq -r '.ANON_KEY // .SUPABASE_ANON_KEY // .PUBLISHABLE_KEY // empty' "$RUNNER_TEMP/supabase-status.json")
          service=$(jq -r '.SERVICE_ROLE_KEY // .SUPABASE_SERVICE_ROLE_KEY // .SECRET_KEY // empty' "$RUNNER_TEMP/supabase-status.json")
          : "${url:?no API URL in supabase status output}" "${anon:?no anon key}" "${service:?no service-role key}"
          {
            echo "SUPABASE_URL=$url"
            echo "SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
          } >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$url"

      - name: Test
        # SUPABASE_* now point at the ephemeral stack, so the Phase 2/4
        # integration suites (RLS, cataloging) run on every push and on
        # fork PRs too. `apps/facilitator/src/core.test.ts` still needs the
        # STELLAR_FEE_SPONSOR_* secrets (a read-only testnet account check)
        # and is the one suite that depends on repo secrets. The suites
        # refuse a non-local SUPABASE_URL (packages/bazaar/src/db/local-only.ts).
        # RLS against the REAL project: the manual `prod-parity` workflow.
        run: pnpm test

      - name: Licence gate (no AGPL / copyleft transitive, spec §1)
        run: pnpm licence-check

      - name: Dependency audit gate (production graph, spec §6/§7)
        # pnpm's own built-in auditor, not the `osv-scan` reusable workflow
        # removed 2026-08-07 (docs/DEFERRED.md: its call signature broke
        # GitHub's workflow-file parsing and silently zeroed out every CI
        # run from Phase 1 through Phase 3). `--prod` scopes this the same
        # way `pnpm licence-check` is scoped: dependencies +
        # optionalDependencies, not devDependencies, since a build-tool-only
        # advisory never reaches the deployed service. Re-adding `osv-scan`
        # itself (broader than npm advisories) is still a separate, open
        # item; this gate does not close it. One advisory is deliberately
        # ignored via `pnpm-workspace.yaml`'s `auditConfig` (see the comment
        # there for why); this step surfaces everything else as a hard gate.
        run: pnpm audit --prod

      - name: Search relevance gate (nDCG@10 / MRR, spec §5 Phase 5)
        # Seeds its own fixtures into the ephemeral stack, queries them, and
        # fails if nDCG@10 regresses more than 5% against eval/baseline.json.
        # It hard-exits 1 without SUPABASE_* (the gate is not optional), and
        # refuses a non-local SUPABASE_URL like the integration suites.
        run: pnpm eval

      - name: Evidence gate (README/RESULTS.md citations still check out)
        # Turns the evidence table from a photograph into something
        # self-auditing: re-fetches every cited Stellar transaction hash
        # from Horizon, every cited GitHub issue/PR from the GitHub API,
        # and re-confirms every internal doc link still resolves on disk,
        # on every push, not just at the moment each claim was written.
        # Uses the default GITHUB_TOKEN (always available, no extra
        # secret needed) purely to raise the GitHub API rate limit; no
        # write scope is used. Runs on fork PRs too, since none of this
        # needs repository secrets, only outbound network access.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm verify-evidence

      - name: Supabase diagnostics (only on failure)
        if: failure()
        run: |
          docker ps -a --format '{{.Names}}  {{.Status}}' || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_' || true); do
            echo "--- $c"
            docker logs --tail 40 "$c" 2>&1 || true
          done

  # contracts/upto-settlement (Phase 6) is a standalone Cargo/Rust
  # project, not a pnpm workspace member: its own job, its own
  # toolchain, no dependency on the `build` job above. Deliberately does
  # NOT deploy to testnet or run the cargo-fuzz target here: a testnet
  # deploy on every push would spend real fee-sponsor funds for no
  # per-push benefit (the contract address doesn't change), and fuzzing
  # is a periodic/manual exercise (see `docs/DEFERRED.md` for the real
  # 47,630-execution run this phase's gate is based on), not something
  # that belongs in the fast feedback loop. `cargo test` plus a release
  # WASM build is what the smart-contracts skill's own suggested CI
  # pattern covers, and what actually needs to stay green on every push.
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/upto-settlement
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: cargo test (unit + property tests)
        run: cargo test

      - name: Build release WASM (128KB contract-size ceiling)
        run: cargo build --release --target wasm32v1-none

# osv-scan job removed 2026-08-07 (see docs/DEFERRED.md): its
# reusable-workflow call was malformed in a way that broke GitHub's
# workflow-file parsing entirely, which meant the `build` job above never
# ran on any push since Phase 1 either -- confirmed via `gh run list`
# showing every run failing in 0s with zero jobs scheduled. Removing the
# broken job first so `build` runs for real; osv-scan gets added back once
# its correct call signature is confirmed against a real, isolated run.
