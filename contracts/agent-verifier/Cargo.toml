[package]
name = "agent-verifier"
version = "0.1.0"
edition = "2021"
publish = false
description = "Phase 6b retry: a deployable Ed25519 Verifier contract wrapping stellar_accounts::verifiers::ed25519, so agent-smart-account can use a Signer::External signer instead of Signer::Delegated."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# Same pin as agent-smart-account, for the same reason (see that crate's
# Cargo.toml comment): bumped to match stellar-accounts 0.8.0's own
# soroban-sdk ^28.0 requirement.
soroban-sdk = "28.0.0"
stellar-accounts = "0.8.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["rand_core"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
